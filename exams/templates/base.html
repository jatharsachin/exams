<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPPU Exam Management {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --primary: #1a237e; --danger: #c62828; --success: #2e7d32; }
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background: var(--primary); min-height: 100vh; padding: 0; }
        .sidebar .nav-link { color: rgba(255,255,255,.8); padding: 10px 20px; border-left: 3px solid transparent; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.1); border-left-color: #fff; }
        .sidebar .brand { color: #fff; font-size: 1.3rem; font-weight: 700; padding: 18px 15px; border-bottom: 1px solid rgba(255,255,255,.15); }
        .sidebar .brand img { max-height: 50px; }
        .sidebar .logo-row { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,.15); }
        .sidebar .logo-row img { max-height: 45px; background: rgba(255,255,255,0.15); border-radius: 6px; padding: 4px; }
        .sidebar .college-info { color: #fff; font-size: 0.8rem; font-weight: 600; line-height: 1.3; }
        .sidebar .college-info small { font-weight: 400; opacity: 0.7; }
        .sidebar .nav-section { color: rgba(255,255,255,.45); font-size: .75rem; text-transform: uppercase; padding: 12px 20px 4px; letter-spacing: 1px; }
        .content-header { display: flex; align-items: center; gap: 15px; padding: 8px 0 15px; border-bottom: 2px solid #e0e0e0; margin-bottom: 15px; }
        .content-header img { max-height: 55px; }
        .content-header h5 { margin: 0; color: #1a237e; font-weight: 700; }
        .card { border: none; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .card-header { background: #fff; border-bottom: 1px solid #e0e0e0; font-weight: 600; border-radius: 8px 8px 0 0 !important; }
        .btn-primary { background: var(--primary); border-color: var(--primary); }
        .stat-card { background: #fff; border-radius: 8px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .stat-card .value { font-size: 2rem; font-weight: 700; }
        .stat-card .label { color: #666; font-size: .85rem; }
        table th { background: #f5f5f5 !important; font-weight: 600; font-size: .85rem; }
        .badge-sitting { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: .75rem; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar">
            <div class="logo-row">
                <img src="/static/college_logo.png" alt="BJ College">
                <img src="/static/sppu_logo.png" alt="SPPU">
            </div>
            <div class="brand">SPPU Exam Mgmt</div>
            <div class="nav flex-column">
                <div class="nav-section">Main</div>
                <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                <a href="/import" class="nav-link {% if request.path == '/import' %}active{% endif %}"><i class="bi bi-upload me-2"></i> Import Data</a>
                <div class="nav-section">Setup</div>
                <a href="/courses" class="nav-link {% if request.path == '/courses' %}active{% endif %}"><i class="bi bi-book me-2"></i> Courses</a>
                <a href="/subjects" class="nav-link {% if request.path == '/subjects' %}active{% endif %}"><i class="bi bi-journal me-2"></i> Subjects</a>
                <a href="/rooms" class="nav-link {% if request.path == '/rooms' %}active{% endif %}"><i class="bi bi-building me-2"></i> Rooms & Blocks</a>
                <a href="/staff" class="nav-link {% if request.path == '/staff' %}active{% endif %}"><i class="bi bi-people me-2"></i> Staff</a>
                <div class="nav-section">Exam Ops</div>
                <a href="/seating" class="nav-link {% if request.path == '/seating' %}active{% endif %}"><i class="bi bi-grid me-2"></i> Block Arrangement</a>
                <a href="/duty" class="nav-link {% if request.path == '/duty' %}active{% endif %}"><i class="bi bi-clipboard-check me-2"></i> Staff Duty</a>
                <a href="/attendance" class="nav-link {% if request.path == '/attendance' %}active{% endif %}"><i class="bi bi-check-square me-2"></i> Attendance</a>
                <a href="/qp" class="nav-link {% if request.path == '/qp' %}active{% endif %}"><i class="bi bi-file-text me-2"></i> QP Management</a>
                <a href="/marks" class="nav-link {% if request.path == '/marks' %}active{% endif %}"><i class="bi bi-pencil-square me-2"></i> Internal Marks</a>
                <a href="/reports" class="nav-link {% if request.path == '/reports' %}active{% endif %}"><i class="bi bi-graph-up me-2"></i> Reports</a>
            </div>
        </nav>
        <main class="col-md-10 ms-auto px-4 py-3">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
