{% extends "base.html" %}{% block title %}| Rooms{% endblock %}
{% block content %}
<h4 class="mb-3 pt-2"><i class="bi bi-building me-2"></i>Rooms & Blocks</h4>
<div class="row"><div class="col-4"><div class="card mb-3"><div class="card-header">Blocks</div><div class="card-body">
    <div class="mb-2"><input class="form-control form-control-sm" id="bname" placeholder="Block Name"></div>
    <div class="mb-2"><input class="form-control form-control-sm" id="bfloor" placeholder="Floor"></div>
    <button class="btn btn-primary btn-sm" onclick="saveBlock()">Add Block</button>
    <ul class="list-group mt-2" id="blist"></ul>
</div></div></div>
<div class="col-8"><div class="card mb-3"><div class="card-header">Rooms</div><div class="card-body">
    <form id="roomForm" class="row g-2"><input type="hidden" id="rid">
        <div class="col-3"><input class="form-control form-control-sm" id="rname" placeholder="Room Name" required></div>
        <div class="col-3"><select class="form-select form-select-sm" id="rblock"></select></div>
        <div class="col-2"><input class="form-control form-control-sm" id="rcap" placeholder="Capacity" type="number" required></div>
        <div class="col-2"><input class="form-control form-control-sm" id="rbench" placeholder="Benches" type="number" required></div>
        <div class="col-2"><button class="btn btn-primary btn-sm" type="submit">Save</button> <button class="btn btn-success btn-sm" type="button" onclick="loadDemoRooms()">Demo</button></div>
    </form>
    <table class="table table-sm table-bordered mt-2"><thead><tr><th>Room</th><th>Block</th><th>Capacity</th><th>Benches</th><th>Action</th></tr></thead><tbody id="rtbody"></tbody></table>
</div></div></div>
<script>
function loadBlocks(){fetch('/api/blocks').then(r=>r.json()).then(data=>{let h='';data.forEach(b=>{h+=`<li class="list-group-item d-flex justify-content-between"><span>${b.name} <small class="text-muted">(${b.floor||'-'})</small></span><button class="btn btn-sm text-danger" onclick="delBlock(${b.id})">&times;</button></li>`;});document.getElementById('blist').innerHTML=h;document.getElementById('rblock').innerHTML='<option value="">-- Block --</option>'+data.map(b=>`<option value="${b.name}">${b.name}</option>`).join('');});}
function saveBlock(){let n=document.getElementById('bname').value.trim();if(!n)return;fetch('/api/blocks/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,floor:document.getElementById('bfloor').value})}).then(()=>{document.getElementById('bname').value='';document.getElementById('bfloor').value='';loadBlocks();});}
function delBlock(id){if(confirm('Delete?')) fetch('/api/blocks/delete/'+id,{method:'DELETE'}).then(()=>{loadBlocks();loadRooms();});}
function loadRooms(){fetch('/api/rooms').then(r=>r.json()).then(data=>{let h='';data.forEach(r=>{h+=`<tr><td>${r.name}</td><td>${r.block_name}</td><td>${r.capacity}</td><td>${r.bench_count}</td><td><button class="btn btn-sm btn-outline-primary" onclick="editRoom(${r.id})">Edit</button> <button class="btn btn-sm btn-outline-danger" onclick="delRoom(${r.id})">Del</button></td></tr>`;});document.getElementById('rtbody').innerHTML=h;});}
function editRoom(id){fetch('/api/rooms').then(r=>r.json()).then(data=>{let r=data.find(x=>x.id==id);if(r){document.getElementById('rid').value=r.id;document.getElementById('rname').value=r.name;document.getElementById('rblock').value=r.block_name;document.getElementById('rcap').value=r.capacity;document.getElementById('rbench').value=r.bench_count;}});}
function delRoom(id){if(confirm('Delete?')) fetch('/api/rooms/delete/'+id,{method:'DELETE'}).then(()=>loadRooms());}
document.getElementById('roomForm').onsubmit=function(e){e.preventDefault();fetch('/api/rooms/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:document.getElementById('rid').value||null,name:document.getElementById('rname').value,block_name:document.getElementById('rblock').value,capacity:document.getElementById('rcap').value,bench_count:document.getElementById('rbench').value})}).then(()=>{this.reset();document.getElementById('rid').value='';loadRooms();});};
function loadDemoRooms(){fetch('/api/demo/rooms',{method:'POST'}).then(()=>{alert('Demo rooms loaded');loadBlocks();loadRooms();});}
loadBlocks();loadRooms();
</script>
{% endblock %}
