{% extends "base.html" %}{% block title %}| Staff{% endblock %}
{% block content %}
<h4 class="mb-3 pt-2"><i class="bi bi-people me-2"></i>Staff</h4>
<div class="card mb-3"><div class="card-body">
    <form id="staffForm" class="row g-2">
        <input type="hidden" id="stid">
        <div class="col-3"><input class="form-control form-control-sm" id="stname" placeholder="Name" required></div>
        <div class="col-2"><input class="form-control form-control-sm" id="stdesig" placeholder="Designation"></div>
        <div class="col-2"><input class="form-control form-control-sm" id="stdept" placeholder="Department"></div>
        <div class="col-2"><input class="form-control form-control-sm" id="stmob" placeholder="Mobile"></div>
        <div class="col-2"><select class="form-select form-select-sm" id="strole"><option>Principal</option><option>CEO</option><option>Senior Supervisor</option><option selected>Junior Supervisor</option><option>Peon</option><option>HOD</option><option>Clerk</option><option>Other</option></select></div>
        <div class="col-1"><button class="btn btn-primary btn-sm" type="submit">Save</button> <button class="btn btn-success btn-sm" type="button" onclick="loadDemo()">Demo</button></div>
    </form>
</div></div>
<table class="table table-bordered table-hover table-sm"><thead><tr><th>Name</th><th>Designation</th><th>Dept</th><th>Mobile</th><th>Role</th><th>Action</th></tr></thead><tbody id="stbody"></tbody></table>
<script>
function loadStaff(){fetch('/api/staff').then(r=>r.json()).then(data=>{let h='';data.forEach(s=>{h+=`<tr><td>${s.name}</td><td>${s.designation||''}</td><td>${s.department||''}</td><td>${s.mobile||''}</td><td><span class="badge bg-${s.role=='Principal'?'danger':s.role=='CEO'?'warning text-dark':'primary'}">${s.role}</span></td><td><button class="btn btn-sm btn-outline-primary" onclick="editStaff(${s.id})">Edit</button> <button class="btn btn-sm btn-outline-danger" onclick="delStaff(${s.id})">Del</button></td></tr>`;});document.getElementById('stbody').innerHTML=h;});}
function editStaff(id){fetch('/api/staff').then(r=>r.json()).then(data=>{let s=data.find(x=>x.id==id);if(s){document.getElementById('stid').value=s.id;document.getElementById('stname').value=s.name;document.getElementById('stdesig').value=s.designation||'';document.getElementById('stdept').value=s.department||'';document.getElementById('stmob').value=s.mobile||'';document.getElementById('strole').value=s.role;}});}
function delStaff(id){if(confirm('Delete?'))fetch('/api/staff/delete/'+id,{method:'DELETE'}).then(()=>loadStaff());}
document.getElementById('staffForm').onsubmit=function(e){e.preventDefault();fetch('/api/staff/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:document.getElementById('stid').value||null,name:document.getElementById('stname').value,designation:document.getElementById('stdesig').value,department:document.getElementById('stdept').value,mobile:document.getElementById('stmob').value,role:document.getElementById('strole').value})}).then(()=>{this.reset();document.getElementById('stid').value='';loadStaff();});};
function loadDemo(){fetch('/api/demo/staff',{method:'POST'}).then(()=>{alert('Demo staff loaded');loadStaff();});}
loadStaff();
</script>
{% endblock %}
