{% extends "base.html" %}{% block title %}| Subjects{% endblock %}
{% block content %}
<h4 class="mb-3 pt-2"><i class="bi bi-journal me-2"></i>Subjects</h4>
<div class="card mb-3"><div class="card-body">
    <form id="subjForm" class="row g-2">
        <input type="hidden" id="sid">
        <div class="col-2"><input class="form-control" id="scode" placeholder="Code" required></div>
        <div class="col-3"><input class="form-control" id="sname" placeholder="Subject Name" required></div>
        <div class="col-2"><select class="form-select" id="scourse"></select></div>
        <div class="col-1"><input class="form-control" id="spaper" value="1" type="number"></div>
        <div class="col-2"><select class="form-select" id="stype"><option>Theory</option><option>Practical</option><option>Oral</option><option>Project</option><option>Internal</option><option>Termwork</option></select></div>
        <div class="col-1"><input class="form-control" id="scredits" value="4" type="number"></div>
        <div class="col-1"><button class="btn btn-primary btn-sm" type="submit">Save</button></div>
    </form>
</div></div>
<table class="table table-bordered table-hover table-sm"><thead><tr><th>Code</th><th>Name</th><th>Course</th><th>Paper</th><th>Type</th><th>Credits</th><th>Action</th></tr></thead><tbody id="stbody"></tbody></table>
<script>
function loadSubjects(){fetch('/api/subjects').then(r=>r.json()).then(data=>{let h='';data.forEach(s=>{h+=`<tr><td><code>${s.code}</code></td><td>${s.name}</td><td>${s.course_name||s.course_code}</td><td>${s.paper_no}</td><td>${s.type}</td><td>${s.credits}</td><td><button class="btn btn-sm btn-outline-primary" onclick="editSubj(${s.id})">Edit</button> <button class="btn btn-sm btn-outline-danger" onclick="delSubj(${s.id})">Del</button></td></tr>`;});document.getElementById('stbody').innerHTML=h;});}
function editSubj(id){fetch('/api/subjects').then(r=>r.json()).then(data=>{let s=data.find(x=>x.id==id);if(s){document.getElementById('sid').value=s.id;document.getElementById('scode').value=s.code;document.getElementById('sname').value=s.name;document.getElementById('scourse').value=s.course_code;document.getElementById('spaper').value=s.paper_no;document.getElementById('stype').value=s.type;document.getElementById('scredits').value=s.credits;}});}
function delSubj(id){if(confirm('Delete?')) fetch('/api/subjects/delete/'+id,{method:'DELETE'}).then(()=>loadSubjects());}
fetch('/api/courses').then(r=>r.json()).then(data=>{let o='';data.forEach(c=>{o+=`<option value="${c.code}">${c.code} - ${c.name}</option>`;});document.getElementById('scourse').innerHTML=o;});
document.getElementById('subjForm').onsubmit=function(e){e.preventDefault();fetch('/api/subjects/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:document.getElementById('sid').value||null,code:document.getElementById('scode').value,name:document.getElementById('sname').value,course_code:document.getElementById('scourse').value,paper_no:document.getElementById('spaper').value,type:document.getElementById('stype').value,credits:document.getElementById('scredits').value})}).then(()=>{this.reset();document.getElementById('sid').value='';document.getElementById('scourse').innerHTML=document.getElementById('scourse').innerHTML;loadSubjects();});};
loadSubjects();
</script>
{% endblock %}
