{% extends "base.html" %}{% block title %}| Staff Duty{% endblock %}
{% block content %}
<h4 class="mb-3 pt-2"><i class="bi bi-clipboard-check me-2"></i>Staff Duty - Exam Order</h4>
<div class="row g-2 mb-3">
    <div class="col-3"><select class="form-select" id="ddate"></select></div>
    <div class="col-2"><select class="form-select" id="dsession"><option value="1">Morning</option><option value="2">Afternoon</option></select></div>
    <div class="col-2"><button class="btn btn-primary btn-sm" onclick="assignDuty()">Auto-Assign</button></div>
    <div class="col-2"><button class="btn btn-warning btn-sm" onclick="clearDuty()">Clear</button></div>
    <div class="col-3"><button class="btn btn-success btn-sm" onclick="printOrder()">Print Exam Order</button></div>
</div>
<table class="table table-bordered table-hover table-sm"><thead><tr><th>Room</th><th>Block</th><th>Subject</th><th>Junior Supervisor</th><th>Senior Supervisor</th><th>Peon</th></tr></thead><tbody id="dutBody"></tbody></table>
<script>
fetch('/api/util/dates').then(r=>r.json()).then(d=>{let h='';d.forEach(x=>h+=`<option>${x}</option>`);document.getElementById('ddate').innerHTML=h;});
function loadDuty(){let dt=document.getElementById('ddate').value;let sess=document.getElementById('dsession').value;fetch(`/api/duty/view?date=${dt}&session=${sess}`).then(r=>r.json()).then(data=>{let h='';if(!data.length)h='<tr><td colspan="6" class="text-muted">No duties assigned. Click Auto-Assign.</td></tr>';else data.forEach(d=>{h+=`<tr><td>${d.room||''}</td><td>${d.block||''}</td><td><code>${d.subject||''}</code></td><td>${d['Junior Supervisor']||'--'}</td><td>${d['Senior Supervisor']||'--'}</td><td>${d['Peon']||'--'}</td></tr>`;});document.getElementById('dutBody').innerHTML=h;});}
function assignDuty(){let dt=document.getElementById('ddate').value;fetch('/api/duty/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:dt,session_id:document.getElementById('dsession').value})}).then(()=>loadDuty());}
function clearDuty(){if(confirm('Clear?'))fetch('/api/duty/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:document.getElementById('ddate').value,session_id:document.getElementById('dsession').value})}).then(()=>loadDuty());}
function printOrder(){let txt='SPPU COLLEGE - EXAM ORDER\n'+'='.repeat(70)+'\nDate: '+document.getElementById('ddate').value+'\n\n';fetch(`/api/duty/view?date=${document.getElementById('ddate').value}&session=${document.getElementById('dsession').value}`).then(r=>r.json()).then(data=>{data.forEach(d=>{txt+=`${d.room||''} | ${d.subject||''} | Jr:${d['Junior Supervisor']||'--'} | Sr:${d['Senior Supervisor']||'--'} | Peon:${d['Peon']||'--'}\n`;});let b=new Blob([txt],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Exam_Order.txt';a.click();});}
loadDuty();
</script>
{% endblock %}
